<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table of Contents</title>
  <style>
    @media print {
      @page {
        size: A4;
        margin: 12mm;
      }

      body {
        margin: 0;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }

    .report-page.toc-page {
      padding: 3.5rem;
      height: 100vh;
      box-sizing: border-box;
      page-break-after: always;
      font-family: "Segoe UI", SegoeUI, Arial, sans-serif;
      font-size: 14px;
      color: #1e293b;
      background-color: #ffffff;
    }

    .heading {
      font-size: 14pt !important;
      font-weight: normal !important;
      text-align: left !important;
      padding-left: 0 !important;
      margin-left: 0 !important;
      color: #2F5597 !important;
      margin: 0;
    }

    .divider {
      border: none;
      height: 0px;
      background-color: #cbd5e1;
      margin: 1rem 0 2rem 0;
    }

    .list-container {
      display: block;
    }

    .list-container > .toc-row,
    .list-container > h1.toc-heading,
    .list-container > h2.toc-heading,
    .list-container > h3.toc-heading,
    .list-container > h4.toc-heading,
    .list-container > h5.toc-heading,
    .list-container > h6.toc-heading {
      display: flex;
      align-items: center;
      margin: 0;
      padding: 0.14rem 0;
      font-family: "Segoe UI", SegoeUI, Arial, sans-serif;
      font-size: 12px;
      line-height: 1.35;
    }

    .toc-row {
      display: flex !important;
      align-items: center !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0.14rem 0 !important;
      box-sizing: border-box !important;
    }

    .toc-row.toc-level-1 {
      font-weight: bold;
      font-size: 13.5px;
      padding-top: 0.24rem;
      margin-left: 0 !important;
    }

    .toc-row.toc-level-2 {
      margin-left: 0 !important;
      font-weight: normal;
      font-size: 12.5px;
      padding-top: 0.1rem;
    }

    .toc-row.toc-level-2 .toc-title {
      padding-left: 20px !important;
    }

    .toc-row.toc-level-3 {
      margin-left: 0 !important;
      font-weight: normal;
      font-size: 12px;
      padding-top: 0.1rem;
    }

    .toc-row.toc-level-3 .toc-title {
      padding-left: 40px !important;
    }

    .toc-row.toc-level-4 {
      margin-left: 0 !important;
      font-weight: normal;
      font-size: 12px;
      padding-top: 0.1rem;
    }

    .toc-row.toc-level-4 .toc-title {
      padding-left: 60px !important;
    }

    .toc-heading[data-toc-level="1"],
    [data-toc-level="1"] {
      font-size: 16pt !important;
      font-weight: bold !important;
      text-align: left !important;
      padding-left: 0 !important;
      margin-left: 0 !important;
      color: #2F5597 !important;
    }

    .toc-heading[data-toc-level="2"],
    [data-toc-level="2"] {
      font-size: 14pt !important;
      font-weight: bold !important;
      text-align: left !important;
      padding-left: 0 !important;
      margin-left: 0 !important;
      color: #2F5597 !important;
    }

    .toc-heading[data-toc-level="3"],
    [data-toc-level="3"] {
      font-size: 12pt !important;
      font-weight: bold !important;
      text-align: left !important;
      padding-left: 0 !important;
      margin-left: 0 !important;
      color: #2F5597 !important;
    }

    .toc-title {
      background-color: #fff;
      padding-right: 0.25rem;
      z-index: 1;
      white-space: nowrap;
    }

    .toc-dots {
      flex: 1;
      border-bottom: 1px dotted #94a3b8;
      height: 0;
      align-self: center;
      margin: 0 0.25rem;
    }

    .toc-page-num {
      background-color: #fff;
      padding-left: 0.5rem;
      z-index: 1;
      text-align: right;
      min-width: 1.5rem;
      white-space: nowrap;
    }

    .title {
      background-color: #fff;
      padding-right: 0.1rem;
      z-index: 1;
    }

    .dot-leader {
      flex-grow: 1;
      border-bottom: 1px dotted #94a3b8;
      margin-bottom: 0;
    }

    .page-number {
      background-color: #fff;
      padding-left: 0.5rem;
      z-index: 1;
      text-align: right;
      min-width: 1.5rem;
    }

    a.toc-link,
    a.toc-link:link,
    a.toc-link:visited,
    a.toc-link:hover,
    a.toc-link:active,
    a.toc-link *,
    .toc-row a,
    .toc-row a * {
      display: contents;
      text-decoration: none !important;
      color: inherit !important;
      cursor: pointer !important;
    }
  </style>
</head>

<body>

  <div class="report-page toc-page">
    <h2 class="heading">Table of Contents</h2>
    <hr class="divider" />

    <div class="list-container" id="toc-content">
      {{TOC_PLACEHOLDER}}
    </div>
  </div>

</body>

</html>
