<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Control</title>
  <style>
    .report-page.doc-control-page,
    .doc-control-page {
      padding: 0 !important;
      margin: 0 auto !important;
      box-sizing: border-box !important;
      width: 100% !important;
      max-width: 100% !important;
      min-height: 297mm !important;
      page-break-inside: avoid !important;
      page-break-after: always !important;
      break-inside: avoid !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif !important;
      color: #1e293b !important;
      background-color: #ffffff !important;
    }

    .doc-control-top {
      display: block !important;
      width: 100% !important;
      box-sizing: border-box !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .doc-control-middle {
      display: block !important;
      width: 100% !important;
      text-align: center !important;
      margin: auto 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }

    .doc-control-middle .heading {
      font-size: 2.2rem !important;
      font-weight: 700 !important;
      color: #0f172a !important;
      margin: 0 !important;
      text-align: center !important;
    }

    .logo-row-container {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      height: 60px;
      margin: 0;
      padding: 0;
    }

    .logo-element {
      max-height: 100%;
      max-width: 180px;
      object-fit: contain;
    }

    .sub-heading {
      font-size: 0.9rem;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 0.05em;
      margin: 0 0 0.75rem 0;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 0.25rem;
    }

    .org-name {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 0.5rem 0;
      color: #0f172a;
    }

    .address {
      font-size: 0.95rem;
      color: #475569;
      margin-top: 0;
      line-height: 1.5;
      white-space: pre-line;
    }

    .doc-control-bottom,
    .bottom-layout-group {
      display: flex !important;
      flex-direction: column !important;
      align-items: stretch !important;
      justify-content: flex-end !important;
      width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
      text-align: center !important;
      margin-top: auto !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      padding: 0 !important;
    }

    [id*="-report"] .doc-control-page .revision-section,
    .report-page.doc-control-page .revision-section,
    .doc-control-page .revision-section {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 1rem 0 !important;
      padding: 0 !important;
      align-self: stretch !important;
      box-sizing: border-box !important;
      clear: both !important;
      position: static !important;
      left: auto !important;
      right: auto !important;
      transform: none !important;
    }

    table.table.no-edit,
    .revision-section table,
    .doc-control-page table.table,
    [id*="-report"] .doc-control-page table {
      display: table !important;
      width: 100% !important;
      max-width: 100% !important;
      table-layout: fixed !important;
      border-collapse: collapse !important;
      box-sizing: border-box !important;
      font-size: 9pt !important;
    }

    .doc-control-page table.table th,
    .revision-section table th {
      box-sizing: border-box !important;
      padding: 10px 10px !important;
      font-weight: 600 !important;
      background-color: #163c7a !important;
      color: #ffffff !important;
      text-align: center !important;
      font-size: 9pt !important;
      line-height: 1.3 !important;
      word-break: break-word !important;
      overflow-wrap: break-word !important;
      border: 1px solid #163c7a !important;
    }

    .doc-control-page table.table td,
    .revision-section table td {
      box-sizing: border-box !important;
      padding: 10px 12px !important;
      color: #475569 !important;
      line-height: 1.4 !important;
      text-align: center !important;
      font-size: 9pt !important;
      word-break: break-word !important;
      overflow-wrap: break-word !important;
      border: 1px solid #cbd5e1 !important;
    }

    .seal-container {
      margin-top: 1cm;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .seal-container[data-display="none"] {
      display: none;
    }

    .seal-box {
      width: 220px;
      height: 220px;
      border: 1px dashed #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      border-radius: 4px;
      margin: 0 auto;
      overflow: hidden;
    }

    .seal-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .seal-placeholder {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 500;
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>

<body>

  <div class="report-page doc-control-page">
    <div class="doc-control-top">
      <table border="0"
        style="width: 100%; table-layout: fixed; border: none; border-collapse: collapse; margin-top: 40px; margin-bottom: 1.5rem;">
        <tr>
          <td
            style="width: 50%; border: none !important; padding: 0 1.25rem 0 0; vertical-align: top; text-align: left;">
            <div class="logo-row-container" style="justify-content: flex-start;">
              <img src="{{PV_LOGO}}" alt="PVinsight Logo" class="logo-element" />
            </div>

            <h3 class="sub-heading">Prepared By</h3>
            <p class="org-name">PVinsight Inc</p>
            <p class="address">5717 Legacy Dr Suite 250, Plano, Texas, 75024</p>
          </td>
          <td
            style="width: 50%; border: none !important; padding: 0 0 0 1.25rem; vertical-align: top; text-align: left;">
            <div class="logo-row-container" style="justify-content: flex-start;">
              <img src="{{CLIENT_LOGO}}" alt="Client Logo" class="logo-element" />
            </div>

            <h3 class="sub-heading">Submitted To</h3>
            <p class="org-name">{{submittedTo}}</p>
            <p class="address">{{submittedToAddress}}</p>
          </td>
        </tr>
      </table>
    </div>

    <div class="doc-control-middle">
      <h2 class="heading">{{REPORT_NAME}}</h2>
    </div>

    <div class="revision-section">
      <table class="table no-edit" border="1">
        <colgroup>
          <col style="width: 10%;">
          <col style="width: 16%;">
          <col style="width: 24%;">
          <col style="width: 30%;">
          <col style="width: 20%;">
        </colgroup>
        <thead>
          <tr style="background-color: #163c7a; color: #ffffff;">
            <th style="padding: 10px; text-align: center; border: 1px solid #163c7a;">Revision</th>
            <th style="padding: 10px; text-align: center; border: 1px solid #163c7a;">Issue Date</th>
            <th style="padding: 10px; text-align: center; border: 1px solid #163c7a;">Document No.</th>
            <th style="padding: 10px; text-align: center; border: 1px solid #163c7a;">Document Name</th>
            <th style="padding: 10px; text-align: center; border: 1px solid #163c7a;">Description</th>
          </tr>
        </thead>
        <tbody>
          {{REVISION_HISTORY_ROWS}}
        </tbody>
      </table>
    </div>

    <div class="doc-control-bottom bottom-layout-group">
      <div class="seal-container" data-display="{{SHOW_STAMP}}">
        <div class="seal-box">
          {{SEAL_CONTENT}}
        </div>
      </div>
    </div>
  </div>
</body>

</html>
